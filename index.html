<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Drzewo Wiedzy — Obsidian Sketchbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper:      #f2e8d5;
      --paper-mid:  #e8dcc6;
      --paper-dark: #ddd0b4;
      --ink:        #2a1a0e;
      --ink-mid:    #5a3c24;
      --ink-light:  #9a7050;
      --leaf:       #3a5c2e;
      --leaf-light: #6a9b58;
      --accent:     #b87820;
      --accent-bg:  rgba(184,120,32,0.12);
      --border:     #c8b08a;
      --panel-bg:   #faf4e6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--paper); }

    /* ── LAYOUT ── */
    #layout { display: flex; flex-direction: column; height: 100vh; }

    #header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 14px; gap: 8px;
      background: var(--panel-bg);
      border-bottom: 1.5px solid var(--border);
      flex-shrink: 0; z-index: 10;
    }

    #header-title {
      font-family: 'Caveat', cursive; font-size: 21px; font-weight: 700;
      color: var(--ink); white-space: nowrap; user-select: none;
    }
    @media (max-width: 480px) { #header-title { font-size: 17px; } }

    #header-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .btn {
      display: flex; align-items: center; gap: 4px;
      background: transparent; border: 1.5px solid var(--border);
      color: var(--ink-mid); padding: 5px 10px; border-radius: 8px;
      cursor: pointer; font-family: 'Caveat', cursive; font-size: 15px;
      transition: background 0.15s, color 0.15s; white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover, .btn:active { background: var(--paper-dark); color: var(--ink); }
    .btn.green { border-color: var(--leaf); color: var(--leaf); }
    .btn.green:hover, .btn.green:active { background: rgba(58,92,46,0.1); }
    .btn-label { font-size: 13px; }
    @media (max-width: 520px) { .btn-label { display: none; } .btn { padding: 5px 8px; } }

    #upload-btn { position: relative; overflow: hidden; }
    #upload-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }

    /* ── MAIN ── */
    #main { display: flex; flex: 1; overflow: hidden; }

    #tree-container { flex: 1; position: relative; overflow: hidden; touch-action: none; }
    #tree-canvas { display: block; width: 100%; height: 100%; }

    /* ── DESKTOP SIDE PANEL ── */
    #side-panel {
      width: 285px; flex-shrink: 0;
      background: var(--panel-bg); border-left: 1.5px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    @media (max-width: 767px) { #side-panel { display: none; } }

    .panel-label {
      font-size: 9px; text-transform: uppercase; letter-spacing: 2.5px;
      color: var(--ink-light); margin-bottom: 4px;
    }
    #sp-head { padding: 14px 16px 11px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    #sp-title {
      font-family: 'Caveat', cursive; font-size: 22px; font-weight: 700;
      color: var(--ink); line-height: 1.2; margin-top: 3px;
    }
    #sp-title.empty { font-family: system-ui; font-size: 12px; font-weight: 400; color: #bbb; font-style: italic; }
    #sp-body { flex: 1; overflow-y: auto; padding: 13px 16px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    #sp-links { padding: 10px 16px 14px; border-top: 1px solid var(--border); flex-shrink: 0; }

    /* ── SHARED NOTE CONTENT ── */
    .note-md { font-size: 13.5px; line-height: 1.75; color: var(--ink-mid); }
    .note-md h1 { font-family: 'Caveat', cursive; font-size: 21px; color: var(--ink); margin: 14px 0 3px; }
    .note-md h2 { font-family: 'Caveat', cursive; font-size: 17px; color: var(--ink); margin: 11px 0 2px; }
    .note-md h3 { font-size: 13px; color: var(--ink-mid); font-weight: 600; margin: 9px 0 2px; }
    .note-md p { margin-bottom: 9px; }
    .note-md ul, .note-md ol { margin: 4px 0 9px 16px; }
    .note-md li { margin-bottom: 3px; }
    .note-md strong { color: var(--ink); }
    .note-md em { color: var(--accent); }
    .note-md code {
      background: rgba(58,92,46,0.1); color: var(--leaf);
      padding: 1px 5px; border-radius: 3px;
      font-size: 12px; font-family: 'Cascadia Code', 'Fira Code', monospace;
    }
    .note-md pre {
      background: rgba(42,26,14,0.06); border: 1px solid var(--border);
      border-radius: 7px; padding: 10px 12px; margin: 7px 0; overflow-x: auto;
    }
    .note-md pre code { background: none; color: var(--leaf); font-size: 11.5px; padding: 0; }
    .note-md blockquote {
      border-left: 3px solid var(--border); padding-left: 10px;
      margin: 6px 0; color: var(--ink-light); font-style: italic;
    }
    .note-md table { border-collapse: collapse; width: 100%; font-size: 12px; margin: 6px 0; }
    .note-md td, .note-md th { border: 1px solid var(--border); padding: 4px 8px; }
    .note-md th { background: rgba(42,26,14,0.05); font-weight: 600; }
    .wiki-link { color: var(--leaf); cursor: pointer; border-bottom: 1px dashed var(--leaf-light); }
    .wiki-link:hover { color: var(--ink); }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
    .chip {
      background: rgba(58,92,46,0.08); border: 1.5px solid rgba(58,92,46,0.25);
      border-radius: 20px; padding: 2px 10px;
      font-family: 'Caveat', cursive; font-size: 14px; color: var(--leaf);
      cursor: pointer; transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .chip:hover, .chip:active { background: rgba(58,92,46,0.18); }

    /* ── TOOLTIP ── */
    #tooltip {
      position: fixed; z-index: 200;
      background: var(--ink); color: var(--paper);
      padding: 5px 11px; border-radius: 7px;
      font-family: 'Caveat', cursive; font-size: 15px;
      pointer-events: none; display: none; white-space: nowrap;
    }

    /* ── PROGRESS ── */
    #progress {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      font-family: 'Caveat', cursive; font-size: 14px; color: var(--ink-mid);
      background: rgba(242,232,213,0.88); border: 1px solid var(--border);
      padding: 3px 13px; border-radius: 20px; pointer-events: none;
      transition: opacity 0.6s; white-space: nowrap;
    }

    /* ── DROP OVERLAY ── */
    #drop-overlay {
      position: absolute; inset: 0; display: none;
      background: rgba(242,232,213,0.9); border: 3px dashed var(--leaf);
      align-items: center; justify-content: center; z-index: 50; pointer-events: none;
    }
    #drop-overlay.active { display: flex; }
    #drop-overlay span {
      font-family: 'Caveat', cursive; font-size: 22px; color: var(--leaf);
      background: var(--panel-bg); border: 1.5px solid var(--leaf);
      padding: 14px 28px; border-radius: 10px;
    }

    /* ── MOBILE FAB ── */
    #fab {
      position: absolute; bottom: 46px; right: 14px;
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--panel-bg); border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; cursor: pointer; z-index: 10;
      box-shadow: 0 2px 8px rgba(42,26,14,0.18);
      -webkit-tap-highlight-color: transparent;
    }
    @media (min-width: 768px) { #fab { display: none; } }

    /* ── BOTTOM SHEET (mobile) ── */
    #backdrop {
      position: fixed; inset: 0; z-index: 150;
      background: rgba(42,26,14,0.35); opacity: 0;
      pointer-events: none; transition: opacity 0.3s;
    }
    #backdrop.on { opacity: 1; pointer-events: auto; }

    #sheet {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--panel-bg);
      border-radius: 22px 22px 0 0; border-top: 2px solid var(--border);
      max-height: 75vh; z-index: 200;
      display: flex; flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
      will-change: transform;
    }
    #sheet.open { transform: translateY(0); }
    @media (min-width: 768px) { #sheet, #backdrop { display: none !important; } }

    #sheet-handle { display: flex; justify-content: center; padding: 10px 0 5px; flex-shrink: 0; cursor: grab; }
    .handle-bar { width: 38px; height: 4px; background: var(--border); border-radius: 2px; }

    #sheet-head { padding: 1px 18px 11px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    #sheet-title { font-family: 'Caveat', cursive; font-size: 25px; font-weight: 700; color: var(--ink); line-height: 1.2; }
    #sheet-body { flex: 1; overflow-y: auto; padding: 12px 18px; scrollbar-width: thin; }
    #sheet-links-wrap { padding: 9px 18px 28px; border-top: 1px solid var(--border); flex-shrink: 0; }
  </style>
</head>
<body>

</div>

// ════════════════════════════════════════════════════════════════
//  PARSER OBSIDIAN
// ════════════════════════════════════════════════════════════════
function parseNotes(mdMap) {
  const notes = {};
  for (const [name, content] of Object.entries(mdMap)) {
    const links = [];
    const re = /\[\[([^\]|#]+?)(?:\|[^\]]*)?\]\]/g;
    let m;
    while ((m = re.exec(content)) !== null) {
      const t = m[1].trim();
      if (!links.includes(t)) links.push(t);
    }
    notes[name] = { content, links };
  }
  return notes;
}

function findRoot(notes) {
  const linked = new Set();
  Object.values(notes).forEach(n => n.links.forEach(l => linked.add(l)));
  const candidates = Object.keys(notes).filter(id => !linked.has(id));
  if (candidates.length === 1) return candidates[0];
  return Object.entries(notes).sort((a,b) => b[1].links.length - a[1].links.length)[0]?.[0];
}

function buildTree(notes, rootId) {
  const visited = new Set();
  function build(id) {
    if (visited.has(id) || !notes[id]) return null;
    visited.add(id);
    const children = notes[id].links.map(build).filter(Boolean);
    return { id, name: id.replace(/-/g,' '), content: notes[id].content, links: notes[id].links, children };
  }
  return build(rootId);
}

// ════════════════════════════════════════════════════════════════
//  LAYOUT + FIT
// ════════════════════════════════════════════════════════════════
function layoutTree(node, x, y, angle, len, depth) {
  node.x = x; node.y = y; node.angle = angle;
  node.depth = depth; node.isLeaf = node.children.length === 0;
  const n = node.children.length;
  if (!n) return;
  const spreads = [1.45, 1.1, 0.85, 0.65, 0.5, 0.4];
  const sp = spreads[Math.min(depth, spreads.length - 1)];
  node.children.forEach((c, i) => {
    const t = n === 1 ? 0 : (i / (n - 1) - 0.5);
    const a = angle + t * sp;
    layoutTree(c, x + Math.sin(a) * len, y - Math.cos(a) * len, a, len * 0.69, depth + 1);
  });
}

function collectNodes(node, out) {
  out.push(node);
  node.children.forEach(c => collectNodes(c, out));
}

function fitTree(nodes, root, W, H) {
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  nodes.forEach(n => { x0=Math.min(x0,n.x); x1=Math.max(x1,n.x); y0=Math.min(y0,n.y); y1=Math.max(y1,n.y); });
  const pad = 28, groundY = H * 0.87;
  const scaleX = (W - pad*2) / (x1 - x0 || 1);
  const scaleY = (groundY - pad) / (y0 - y1 || 1) * -1; // y1 < y0 (top is more negative)
  // Actually tree goes upward so yMin=top (most negative), yMax=0 (root)
  const treeH = Math.abs(y0); // root is at 0,0, leaves at negative y
  const treeW = x1 - x0;
  const scale = Math.min((W - pad*2) / (treeW || 1), (groundY - pad * 3) / (treeH || 1));
  const rx = root.x, ry = root.y;
  nodes.forEach(n => {
    n.x = W / 2 + (n.x - rx) * scale;
    n.y = groundY + (n.y - ry) * scale;
  });
}

// ════════════════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════════════════
function lerp(a,b,t){ return a+(b-a)*t; }
function lp(a,b,t){ return {x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)}; }

function splitBez(p0,p1,p2,p3,t){
  t = Math.max(0,Math.min(1,t));
  const p01=lp(p0,p1,t),p12=lp(p1,p2,t),p23=lp(p2,p3,t);
  const p012=lp(p01,p12,t),p123=lp(p12,p23,t);
  return [p0,p01,p012,lp(p012,p123,t)];
}

function seededRng(s){ return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }

// Branch colors — ink/sepia tones graduating to olive-green
const BCOLS = ['#2a1a0a','#4a2e16','#5a3a1e','#7a5830','#7a7028','#4a6a28'];
function branchColor(d){ return BCOLS[Math.min(d,BCOLS.length-1)]; }
function branchWidth(d){ return Math.max(1.0, 13*Math.pow(0.6,d)); }

// Leaf color sets (pencil sketch greens)
const LEAFCOLS = [
  ['rgba(50,80,40,0.15)','rgba(42,72,32,0.7)'],
  ['rgba(40,90,35,0.15)','rgba(38,80,30,0.7)'],
  ['rgba(60,85,30,0.15)','rgba(52,78,26,0.7)'],
  ['rgba(35,75,50,0.15)','rgba(30,68,42,0.7)'],
  ['rgba(65,80,25,0.15)','rgba(58,72,22,0.7)'],
];

// ════════════════════════════════════════════════════════════════
//  CANVAS
// ════════════════════════════════════════════════════════════════
const canvas = document.getElementById('tree-canvas');
const ctx = canvas.getContext('2d');

function resize(){
  const c = document.getElementById('tree-container');
  canvas.width = c.clientWidth;
  canvas.height = c.clientHeight;
}
window.addEventListener('resize', ()=>{ resize(); restartAnim(); });
resize();

// ════════════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════════════
let treeRoot=null, allNodes=[], allBranches=[];
let activeBranches=[], doneBranches=[], leaves=[];
let hovered=null, selected=null, leafIdx=0, rafId=null;
let currentNotes = parseNotes(EXAMPLE);

// ════════════════════════════════════════════════════════════════
//  BUILD BRANCHES (after fit)
// ════════════════════════════════════════════════════════════════
function buildBranches(node, list){
  node.children.forEach(child=>{
    const dx=child.x-node.x, dy=child.y-node.y;
    const len=Math.hypot(dx,dy)||1;
    const px=-dy/len, py=dx/len;
    const rng = seededRng(node.id.charCodeAt(0)*137 + child.id.charCodeAt(0)*31);
    const jit = Math.max(0.5, 3.5 - child.depth*0.6);
    // Main bezier
    const cp1 = { x: node.x+dx*0.22+px*(rng()-0.5)*jit*3, y: node.y+dy*0.22+py*(rng()-0.5)*jit*3 };
    const cp2 = { x: node.x+dx*0.75+px*(rng()-0.5)*jit*4, y: node.y+dy*0.75+py*(rng()-0.5)*jit*4 };
    // Rough "sketch" bezier (second pass)
    const r2 = seededRng(node.id.charCodeAt(0)*53 + child.id.charCodeAt(0)*97 + 17);
    const rcp1 = { x: cp1.x+(r2()-0.5)*jit*2.5, y: cp1.y+(r2()-0.5)*jit*2.5 };
    const rcp2 = { x: cp2.x+(r2()-0.5)*jit*3,   y: cp2.y+(r2()-0.5)*jit*3 };
    list.push({ parent:node, child, cp1, cp2, rcp1, rcp2, depth:child.depth, progress:0, done:false, active:false });
    buildBranches(child, list);
  });
}

// Leaf rng stored per leaf
function makeLeafRng(node, idx){
  return seededRng(node.id.charCodeAt(0)*41 + idx*7 + 3);
}

// ════════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════════
function initAnim(){
  const rootId = findRoot(currentNotes);
  treeRoot = buildTree(currentNotes, rootId);
  if(!treeRoot) return;

  const W=canvas.width, H=canvas.height;
  layoutTree(treeRoot, 0, 0, 0, Math.min(H*0.28, 210), 0);
  allNodes=[]; collectNodes(treeRoot, allNodes);
  fitTree(allNodes, treeRoot, W, H);

  allBranches=[]; buildBranches(treeRoot, allBranches);
  activeBranches=[]; doneBranches=[]; leaves=[]; leafIdx=0;
  allNodes.forEach(n=>{ n.lo = n.depth===0 ? 1 : 0; }); // label opacity

  // Start root's children
  allBranches.filter(b=>b.parent.id===treeRoot.id).forEach(b=>{ b.active=true; activeBranches.push(b); });
  updateProgress();
}

// ════════════════════════════════════════════════════════════════
//  DRAWING — PAPER BACKGROUND
// ════════════════════════════════════════════════════════════════
function drawPaper(){
  const W=canvas.width, H=canvas.height;

  // Paper gradient
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,   '#f5ead6');
  g.addColorStop(0.45,'#ede2ca');
  g.addColorStop(1,   '#e6d8bc');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // Subtle ruled lines (notebook)
  ctx.strokeStyle='rgba(150,120,75,0.06)';
  ctx.lineWidth=0.5;
  for(let y=22;y<H;y+=22){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }

  // Left margin red line (notebook style, very faint)
  const mx = Math.min(44, W*0.09);
  ctx.strokeStyle='rgba(200,100,80,0.08)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(mx,0); ctx.lineTo(mx,H); ctx.stroke();

  // Ground shadow
  const gg = ctx.createLinearGradient(0, H*0.85, 0, H);
  gg.addColorStop(0,'rgba(80,55,20,0)');
  gg.addColorStop(1,'rgba(80,55,20,0.12)');
  ctx.fillStyle=gg; ctx.fillRect(0,H*0.85,W,H*0.15);

  // Vignette
  const vg = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.8);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(60,38,16,0.14)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  // Trunk stub (underground)
  if(treeRoot){
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(treeRoot.x, H*0.97);
    ctx.lineTo(treeRoot.x, treeRoot.y+4);
    ctx.strokeStyle=branchColor(0);
    ctx.lineWidth=branchWidth(0)*1.15;
    ctx.lineCap='round'; ctx.stroke();
    ctx.restore();
  }
}

// ════════════════════════════════════════════════════════════════
//  DRAWING — BRANCH (sketchy double bezier)
// ════════════════════════════════════════════════════════════════
function drawBranch(b, progress){
  if(progress<=0) return;
  const p0={x:b.parent.x,y:b.parent.y}, p3={x:b.child.x,y:b.child.y};
  const [,a1,a2,aE] = splitBez(p0,b.cp1,b.cp2,p3,progress);
  const [,r1,r2,rE] = splitBez(p0,b.rcp1,b.rcp2,p3,progress);
  const w=branchWidth(b.depth), col=branchColor(b.depth);

  ctx.save(); ctx.lineCap='round';

  // Main stroke
  ctx.beginPath(); ctx.moveTo(p0.x,p0.y);
  ctx.bezierCurveTo(a1.x,a1.y,a2.x,a2.y,aE.x,aE.y);
  ctx.strokeStyle=col; ctx.lineWidth=w; ctx.stroke();

  // Sketch secondary stroke (slightly offset, thin)
  ctx.beginPath(); ctx.moveTo(p0.x,p0.y);
  ctx.bezierCurveTo(r1.x,r1.y,r2.x,r2.y,rE.x,rE.y);
  ctx.strokeStyle=col; ctx.lineWidth=w*0.28; ctx.globalAlpha=0.32; ctx.stroke();

  ctx.restore();
}

// ════════════════════════════════════════════════════════════════
//  DRAWING — LEAF (pencil sketch style)
// ════════════════════════════════════════════════════════════════
function drawLeaf(leaf){
  const {node,scale,ci,rng} = leaf;
  if(scale<=0) return;
  const [fill,stroke] = LEAFCOLS[ci];

  ctx.save();
  ctx.translate(node.x,node.y);
  ctx.rotate(node.angle);
  ctx.scale(scale,scale);

  // 3 leaves fanning
  const fanA=[-0.52,0,0.52];
  fanA.forEach(da=>{
    ctx.save();
    ctx.rotate(da+(rng()-0.5)*0.18);
    const sz = 8.5 + rng()*5;

    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.bezierCurveTo(-sz*0.32,-sz*0.42,-sz*0.26,-sz*0.88,0,-sz*1.22);
    ctx.bezierCurveTo( sz*0.26,-sz*0.88, sz*0.32,-sz*0.42,0,0);
    ctx.fillStyle=fill; ctx.fill();
    ctx.strokeStyle=stroke; ctx.lineWidth=0.75/scale; ctx.stroke();

    // Vein
    ctx.beginPath(); ctx.moveTo(0,-sz*0.08); ctx.lineTo(0,-sz*1.08);
    ctx.strokeStyle='rgba(40,65,28,0.35)'; ctx.lineWidth=0.5/scale; ctx.stroke();

    ctx.restore();
  });
  ctx.restore();
}

// ════════════════════════════════════════════════════════════════
//  DRAWING — NODE DOT (ink blot)
// ════════════════════════════════════════════════════════════════
function drawDot(node){
  const isH=hovered?.id===node.id, isS=selected?.id===node.id;
  const r = node.depth===0 ? 6.5 : (node.isLeaf ? 3.5 : 4.5);

  ctx.save();
  if(isS){
    // Ochre glow ring
    ctx.beginPath(); ctx.arc(node.x,node.y,r+6,0,Math.PI*2);
    ctx.fillStyle='rgba(184,120,32,0.12)'; ctx.fill();
    ctx.beginPath(); ctx.arc(node.x,node.y,r+3,0,Math.PI*2);
    ctx.strokeStyle='#b87820'; ctx.lineWidth=1.5; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(node.x,node.y, r+(isH?1.5:0),0,Math.PI*2);
  ctx.fillStyle = isS ? '#b87820' : (isH ? branchColor(2) : branchColor(Math.min(node.depth+1,5)));
  ctx.fill();
  ctx.restore();
}

// ════════════════════════════════════════════════════════════════
//  DRAWING — LABEL (Caveat font, hand-written look)
// ════════════════════════════════════════════════════════════════
function drawLabel(node){
  const op = node.lo || 0;
  if(op<=0) return;
  const isS=selected?.id===node.id, isH=hovered?.id===node.id;
  const isRoot=node.depth===0;
  const fs = isRoot ? 15 : (node.isLeaf ? 11.5 : 12.5);

  ctx.save();
  ctx.globalAlpha = op * (isRoot ? 1 : 0.82);
  ctx.font=`${isS||isRoot?'700':'600'} ${fs}px Caveat, cursive`;

  const label = node.name;
  const tw = ctx.measureText(label).width;

  // Position: above node, leaning in branch direction
  const offY = -(branchWidth(node.depth)/2 + 9);
  let lx = node.x, ly = node.y + offY;
  lx = Math.max(tw/2+6, Math.min(canvas.width-tw/2-6, lx));
  ly = Math.max(fs+5, ly);

  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillStyle = isS ? '#8a5a0a' : (isH ? '#2a1a0e' : 'rgba(58,38,18,0.72)');
  ctx.fillText(label, lx, ly);
  ctx.restore();
}

// ════════════════════════════════════════════════════════════════
//  ANIMATION LOOP
// ════════════════════════════════════════════════════════════════
const BSPEED=0.024, LSPEED=0.032, LOPACITY=0.045;

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawPaper();

  // Completed branches
  doneBranches.forEach(b=>drawBranch(b,1));

  // Active branches — advance + draw
  const finished=[];
  activeBranches.forEach(b=>{
    b.progress=Math.min(1,b.progress+BSPEED);
    drawBranch(b,b.progress);
    if(b.progress>=1&&!b.done){ b.done=true; finished.push(b); }
  });

  // Process finished
  finished.forEach(b=>{
    doneBranches.push(b);
    activeBranches=activeBranches.filter(x=>x!==b);
    const kids=allBranches.filter(x=>x.parent.id===b.child.id&&!x.active);
    if(kids.length){
      kids.forEach(k=>{ k.active=true; activeBranches.push(k); });
    } else if(b.child.isLeaf){
      const rng=makeLeafRng(b.child,leafIdx);
      leaves.push({ node:b.child, scale:0, ci:leafIdx%5, rng });
      leafIdx++;
    }
    b.child.lo=0;
  });

  // Leaves
  leaves.forEach(l=>{ l.scale=Math.min(1,l.scale+LSPEED); drawLeaf(l); });

  // Visible nodes
  const vis=new Set(treeRoot?[treeRoot.id]:[]);
  doneBranches.forEach(b=>{ vis.add(b.parent.id); vis.add(b.child.id); });
  activeBranches.forEach(b=>vis.add(b.parent.id));

  allNodes.forEach(node=>{
    if(!vis.has(node.id)) return;
    if(node.depth!==0) node.lo=Math.min(1,(node.lo||0)+LOPACITY);
    drawDot(node);
    drawLabel(node);
  });

  updateProgress();
  rafId=requestAnimationFrame(animate);
}

function updateProgress(){
  const el=document.getElementById('progress');
  const tot=allBranches.length, done=doneBranches.length;
  if(tot===0||done>=tot){ el.style.opacity='0'; return; }
  el.style.opacity='1';
  el.textContent=`Rośnie drzewo… ${Math.round(done/tot*100)}%  ·  ${Object.keys(currentNotes).length} notatek`;
}

// ════════════════════════════════════════════════════════════════
//  INTERACTION
// ════════════════════════════════════════════════════════════════
function visSet(){
  const s=new Set(treeRoot?[treeRoot.id]:[]);
  doneBranches.forEach(b=>{ s.add(b.parent.id); s.add(b.child.id); });
  activeBranches.forEach(b=>s.add(b.parent.id));
  return s;
}

function nodeAt(mx,my){
  const vs=visSet(); let best=null,bd=Infinity;
  allNodes.forEach(n=>{
    if(!vs.has(n.id)) return;
    const d=Math.hypot(n.x-mx,n.y-my);
    const r=(n.depth===0?16:(n.isLeaf?12:14));
    if(d<r&&d<bd){ best=n; bd=d; }
  });
  return best;
}

// Mouse
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  hovered=nodeAt((e.clientX-r.left)*(canvas.width/r.width),(e.clientY-r.top)*(canvas.height/r.height));
  canvas.style.cursor=hovered?'pointer':'default';
  const tip=document.getElementById('tooltip');
  if(hovered){ tip.style.display='block'; tip.style.left=(e.clientX+13)+'px'; tip.style.top=(e.clientY-8)+'px'; tip.textContent=hovered.name; }
  else tip.style.display='none';
});
canvas.addEventListener('mouseleave',()=>{ hovered=null; document.getElementById('tooltip').style.display='none'; });
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  const n=nodeAt((e.clientX-r.left)*(canvas.width/r.width),(e.clientY-r.top)*(canvas.height/r.height));
  if(n){ selected=n; showNote(n); }
});

// Touch
let tx0,ty0,tt0;
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  tx0=e.touches[0].clientX; ty0=e.touches[0].clientY; tt0=Date.now();
},{ passive:false });
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  const dx=Math.abs(e.changedTouches[0].clientX-tx0), dy=Math.abs(e.changedTouches[0].clientY-ty0);
  if(dx<16&&dy<16&&Date.now()-tt0<280){
    const r=canvas.getBoundingClientRect();
    const n=nodeAt((e.changedTouches[0].clientX-r.left)*(canvas.width/r.width),(e.changedTouches[0].clientY-r.top)*(canvas.height/r.height));
    if(n){ selected=n; showNote(n); if(window.innerWidth<768) openSheet(); }
  }
},{ passive:false });

// ════════════════════════════════════════════════════════════════
//  NOTE PANEL
// ════════════════════════════════════════════════════════════════
function renderMd(md){
  return '<p>'+md
    .replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,c)=>`<pre><code>${c.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code></pre>`)
    .replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/\[\[([^\]|#]+?)(?:\|([^\]]*))?\]\]/g,(_,t,a)=>`<span class="wiki-link" onclick="jumpTo('${t}')">${(a||t).replace(/-/g,' ')}</span>`)
    .replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/^- \[x\] (.+)$/gm,'<li style="color:var(--leaf)">✓ $1</li>')
    .replace(/^- \[ \] (.+)$/gm,'<li style="color:#bbb">☐ $1</li>')
    .replace(/^[-*] (.+)$/gm,'<li>$1</li>')
    .replace(/^\d+\. (.+)$/gm,'<li>$1</li>')
    .replace(/(<li[\s\S]*?<\/li>\n?)+/g,m=>`<ul>${m}</ul>`)
    .replace(/^\|(.+)\|$/gm,(_,c)=>{
      if(c.includes('---')) return '';
      return '<tr>'+c.split('|').map(x=>`<td>${x.trim()}</td>`).join('')+'</tr>';
    })
    .replace(/(<tr>[\s\S]*?<\/tr>\n?)+/g,m=>`<table>${m}</table>`)
    .replace(/\n\n+/g,'\n</p><p>\n')
    +'</p>';
}

function chipsHtml(links){
  return links.map(l=>`<span class="chip" onclick="jumpTo('${l}')">${l.replace(/-/g,' ')}</span>`).join('');
}

function showNote(node){
  const note=currentNotes[node.id];
  const html=renderMd(node.content||'');
  const hasLinks=note?.links?.length>0;

  // Desktop panel
  const spTitle=document.getElementById('sp-title');
  spTitle.textContent=node.name; spTitle.classList.remove('empty');
  document.getElementById('sp-content').innerHTML=html;
  const spLinks=document.getElementById('sp-links');
  if(hasLinks){ document.getElementById('sp-chips').innerHTML=chipsHtml(note.links); spLinks.style.display=''; }
  else spLinks.style.display='none';

  // Mobile sheet
  document.getElementById('sheet-title').textContent=node.name;
  document.getElementById('sheet-content').innerHTML=html;
  const shLinks=document.getElementById('sheet-links-wrap');
  if(hasLinks){ document.getElementById('sheet-chips').innerHTML=chipsHtml(note.links); shLinks.style.display=''; }
  else shLinks.style.display='none';
}

function jumpTo(id){
  const n=allNodes.find(x=>x.id===id);
  if(!n) return;
  selected=n; showNote(n);
  if(window.innerWidth<768){ openSheet(); }
  else { hovered=n; setTimeout(()=>{ if(hovered===n) hovered=null; },1800); }
}

// ════════════════════════════════════════════════════════════════
//  BOTTOM SHEET — mobile
// ════════════════════════════════════════════════════════════════
const sheet=document.getElementById('sheet');
const backdrop=document.getElementById('backdrop');

function openSheet(){ sheet.classList.add('open'); backdrop.classList.add('on'); }
function closeSheet(){ sheet.classList.remove('open'); backdrop.classList.remove('on'); }

// Swipe to dismiss
let sy0=0;
document.getElementById('sheet-handle').addEventListener('touchstart',e=>{ sy0=e.touches[0].clientY; sheet.style.transition='none'; });
document.getElementById('sheet-handle').addEventListener('touchmove',e=>{
  const dy=e.touches[0].clientY-sy0;
  if(dy>0){ sheet.style.transform=`translateY(${dy}px)`; e.preventDefault(); }
},{ passive:false });
document.getElementById('sheet-handle').addEventListener('touchend',e=>{
  sheet.style.transition='';
  const dy=e.changedTouches[0].clientY-sy0;
  if(dy>90) closeSheet();
  else sheet.style.transform='';
});

// ════════════════════════════════════════════════════════════════
//  CONTROLS
// ════════════════════════════════════════════════════════════════
function restartAnim(){
  if(rafId) cancelAnimationFrame(rafId);
  selected=null; hovered=null; closeSheet();
  document.getElementById('sp-title').innerHTML='Kliknij węzeł drzewa';
  document.getElementById('sp-title').className='empty';
  document.getElementById('sp-content').innerHTML='';
  document.getElementById('sp-links').style.display='none';
  initAnim();
  rafId=requestAnimationFrame(animate);
}
function resetExample(){ currentNotes=parseNotes(EXAMPLE); restartAnim(); }

// ════════════════════════════════════════════════════════════════
//  FILE UPLOAD
// ════════════════════════════════════════════════════════════════
document.getElementById('file-input').addEventListener('change',e=>{ loadFiles([...e.target.files]); e.target.value=''; });

const tc=document.getElementById('tree-container');
const dro=document.getElementById('drop-overlay');
tc.addEventListener('dragover',e=>{ e.preventDefault(); dro.classList.add('active'); });
tc.addEventListener('dragleave',e=>{ if(!tc.contains(e.relatedTarget)) dro.classList.remove('active'); });
tc.addEventListener('drop',e=>{ e.preventDefault(); dro.classList.remove('active'); loadFiles([...e.dataTransfer.files].filter(f=>f.name.endsWith('.md'))); });

function loadFiles(files){
  const mds=files.filter(f=>f.name.endsWith('.md'));
  if(!mds.length) return;
  let n=0; const map={};
  mds.forEach(f=>{
    const reader=new FileReader();
    reader.onload=ev=>{ map[f.name.replace(/\.md$/,'')]=ev.target.result; if(++n===mds.length){ currentNotes=parseNotes(map); restartAnim(); } };
    reader.readAsText(f);
  });
}

// ════════════════════════════════════════════════════════════════
//  START — wait for Caveat font
// ════════════════════════════════════════════════════════════════
document.fonts.ready.then(()=> restartAnim());
</script>
