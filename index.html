// ================================================================
// PARSER OBSIDIAN WIKI-LINKÓW
// ================================================================
function parseObsidianNote(filename, content) {
  const links = [];
  const regex = /\[\[([^\]|#]+?)(?:\|[^\]]*)?\]\]/g;
  let m;
  while ((m = regex.exec(content)) !== null) {
    const target = m[1].trim();
    if (!links.includes(target)) links.push(target);
  }
  return { id: filename, content, links };
}

function parseAllNotes(mdMap) {
  const notes = {};
  for (const [name, content] of Object.entries(mdMap)) {
    notes[name] = parseObsidianNote(name, content);
  }
  // Resolve root: node with most incoming OR just pick first / "index"
  return notes;
}

// Find the root: node not referenced by others, or with most outgoing links
function findRoot(notes) {
  const allLinked = new Set();
  for (const note of Object.values(notes)) {
    note.links.forEach(l => allLinked.add(l));
  }
  // Nodes not referenced by anyone are candidates for root
  const candidates = Object.keys(notes).filter(id => !allLinked.has(id));
  if (candidates.length === 1) return candidates[0];
  // Pick node with most links
  let best = null, bestCount = -1;
  for (const [id, note] of Object.entries(notes)) {
    if (note.links.length > bestCount) { best = id; bestCount = note.links.length; }
  }
  return best;
}

// ================================================================
// TREE BUILDER (BFS to avoid cycles)
// ================================================================
function buildTree(notes, rootId) {
  const visited = new Set();
  function build(id) {
    if (visited.has(id)) return null;
    visited.add(id);
    const note = notes[id];
    if (!note) return null;
    const children = note.links.map(l => build(l)).filter(Boolean);
    return { id, name: id.replace(/-/g, ' '), content: note.content, links: note.links, children };
  }
  return build(rootId);
}

// ================================================================
// LAYOUT — organic upward tree
// ================================================================
function layoutTree(node, x, y, angle, length, depth) {
  node.x = x; node.y = y;
  node.angle = angle; node.depth = depth;
  node.branchLength = length;
  node.isLeaf = node.children.length === 0;

  const n = node.children.length;
  if (n === 0) return;

  const spreads = [1.5, 1.1, 0.9, 0.7, 0.55, 0.45];
  const spread = spreads[Math.min(depth, spreads.length - 1)];
  const childLength = length * 0.68;

  node.children.forEach((child, i) => {
    const t = n === 1 ? 0 : (i / (n - 1) - 0.5);
    const childAngle = angle + t * spread;
    layoutTree(child,
      x + Math.sin(childAngle) * length,
      y - Math.cos(childAngle) * length,
      childAngle, childLength, depth + 1
    );
  });
}

// ================================================================
// HELPERS
// ================================================================
function lerp(a, b, t) { return a + (b - a) * t; }
function lerp2(a, b, t) { return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) }; }

function splitBezier(p0, p1, p2, p3, t) {
  t = Math.max(0, Math.min(1, t));
  const p01 = lerp2(p0, p1, t), p12 = lerp2(p1, p2, t), p23 = lerp2(p2, p3, t);
  const p012 = lerp2(p01, p12, t), p123 = lerp2(p12, p23, t);
  const p0123 = lerp2(p012, p123, t);
  return [p0, p01, p012, p0123];
}

function getBranchColor(depth) {
  const palette = [
    [15, 30, 18],  // trunk: very dark brown
    [20, 35, 24],
    [28, 38, 28],
    [80, 38, 26],  // olive
    [110, 42, 30], // dark green
    [125, 50, 36], // green
  ];
  const [h, s, l] = palette[Math.min(depth, palette.length - 1)];
  return `hsl(${h},${s}%,${l}%)`;
}

function getBranchWidth(depth) {
  return Math.max(1.2, 15 * Math.pow(0.58, depth));
}

function seededRand(seed) {
  let s = seed;
  return () => { s = (s * 16807 + 0) % 2147483647; return (s - 1) / 2147483646; };
}

function getLeafColors(idx) {
  const sets = [
    ['#2d6a4f','#40916c','#52b788'],
    ['#386641','#6a994e','#a7c957'],
    ['#1b4332','#2d6a4f','#74c69d'],
    ['#344e41','#3a5a40','#588157'],
    ['#1d3461','#1f487e','#376996'],
  ];
  return sets[idx % sets.length];
}

const ctx = canvas.getContext('2d');

let treeRoot = null, allNodes = [], allBranches = [];
let activeBranches = [], completedBranches = [], leaves = [];
let hoveredNode = null, selectedNode = null;
let leafCounter = 0, animFrameId = null;

function resize() {
  const c = document.getElementById('tree-container');
  canvas.width = c.clientWidth;
  canvas.height = c.clientHeight;
}

window.addEventListener('resize', () => { resize(); restartAnimation(); });
resize();

// ================================================================
// BRANCH LIST BUILDER
// ================================================================
function buildBranchList(node, list) {
  allNodes.push(node);
  node.children.forEach(child => {
    const dx = child.x - node.x, dy = child.y - node.y;
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    const px = -dy / len, py = dx / len;
    const rng = seededRand(node.id.charCodeAt(0) * 31 + child.id.charCodeAt(0));
    const offs = (rng() - 0.5) * len * 0.18;
    list.push({
      parent: node, child,
      cp1: { x: node.x + dx*0.2 + px*offs*0.5, y: node.y + dy*0.2 + py*offs*0.5 },
      cp2: { x: node.x + dx*0.75 + px*offs, y: node.y + dy*0.75 + py*offs },
      depth: child.depth, progress: 0, done: false, active: false
    });
    buildBranchList(child, list);
  });
}

// ================================================================
// INIT ANIMATION
// ================================================================
function initAnimation() {
  const rootId = findRoot(currentNotes);
  treeRoot = buildTree(currentNotes, rootId);
  if (!treeRoot) return;

  const W = canvas.width, H = canvas.height;
  const trunkLen = Math.min(H * 0.26, 220);
  layoutTree(treeRoot, W / 2, H * 0.88, 0, trunkLen, 0);

  allNodes = []; allBranches = [];
  buildBranchList(treeRoot, allBranches);
  completedBranches = []; activeBranches = []; leaves = [];
  leafCounter = 0;

  // Activate root's children branches immediately
  allBranches.filter(b => b.parent.id === treeRoot.id).forEach(b => {
    b.active = true; activeBranches.push(b);
  });

  // Set label opacity for all nodes (fades in after branch arrives)
  allNodes.forEach(n => { n.labelOpacity = n.id === treeRoot.id ? 1 : 0; });

  updateProgress();
}

// ================================================================
// DRAWING
// ================================================================
function drawBackground() {
  const W = canvas.width, H = canvas.height;

  // Night sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.85);
  sky.addColorStop(0, '#060d1a');
  sky.addColorStop(0.6, '#0d1b2a');
  sky.addColorStop(1, '#0f2339');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // Stars — deterministic positions
  const starData = [
    [0.08,0.06],[0.19,0.11],[0.31,0.04],[0.42,0.09],[0.53,0.03],
    [0.64,0.13],[0.75,0.07],[0.88,0.04],[0.93,0.16],[0.11,0.22],
    [0.27,0.19],[0.38,0.27],[0.49,0.15],[0.61,0.24],[0.72,0.18],
    [0.84,0.28],[0.05,0.33],[0.22,0.38],[0.45,0.35],[0.58,0.31],
    [0.77,0.36],[0.91,0.29],[0.15,0.45],[0.33,0.42],[0.66,0.40],
  ];
  starData.forEach(([sx, sy], i) => {
    const size = i % 5 === 0 ? 1.5 : 1;
    const alpha = 0.4 + (i % 3) * 0.2;
    ctx.beginPath();
    ctx.arc(sx * W, sy * H, size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  });

  // Moon
  const mx = W * 0.88, my = H * 0.1, mr = 28;
  const moonGlow = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 3);
  moonGlow.addColorStop(0, 'rgba(220,230,255,0.12)');
  moonGlow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = moonGlow; ctx.fillRect(mx-mr*3, my-mr*3, mr*6, mr*6);
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI*2);
  ctx.fillStyle = '#d8e4f0'; ctx.fill();
  ctx.beginPath(); ctx.arc(mx+8, my-4, mr*0.85, 0, Math.PI*2);
  ctx.fillStyle = '#101c2e'; ctx.fill();

  // Ground
  const ground = ctx.createLinearGradient(0, H*0.84, 0, H);
  ground.addColorStop(0, 'rgba(0,0,0,0)');
  ground.addColorStop(0.15, '#0e2210');
  ground.addColorStop(1, '#071408');
  ctx.fillStyle = ground; ctx.fillRect(0, H*0.84, W, H*0.16);

  // Ground fog/glow near trunk
  if (treeRoot) {
    const fog = ctx.createRadialGradient(treeRoot.x, H, 0, treeRoot.x, H, W*0.25);
    fog.addColorStop(0, 'rgba(20,60,20,0.25)');
    fog.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = fog; ctx.fillRect(0, H*0.75, W, H*0.25);
  }
}

function drawTrunk() {
  if (!treeRoot) return;
  const W = canvas.width, H = canvas.height;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(treeRoot.x, H * 0.95);
  ctx.lineTo(treeRoot.x, treeRoot.y);
  ctx.strokeStyle = getBranchColor(0);
  ctx.lineWidth = getBranchWidth(0) * 1.1;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();
}

function drawBranchSegment(branch, progress) {
  if (progress <= 0) return;
  const p0 = { x: branch.parent.x, y: branch.parent.y };
  const p3 = { x: branch.child.x, y: branch.child.y };
  const [, p1, p2, end] = splitBezier(p0, branch.cp1, branch.cp2, p3, progress);

  ctx.beginPath();
  ctx.moveTo(p0.x, p0.y);
  ctx.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, end.x, end.y);
  ctx.strokeStyle = getBranchColor(branch.depth);
  ctx.lineWidth = getBranchWidth(branch.depth);
  ctx.lineCap = 'round';
  ctx.stroke();
}

function drawLeaf(leaf) {
  if (leaf.scale <= 0) return;
  const node = leaf.node;
  const colors = getLeafColors(leaf.colorIdx);
  const rng = seededRand(node.id.charCodeAt(0) + leaf.leafNum * 7);

  ctx.save();
  ctx.translate(node.x, node.y);
  ctx.rotate(node.angle);
  ctx.scale(leaf.scale, leaf.scale);

  // Draw 3 leaves fanning out
  const angles = [-0.55, 0, 0.55];
  const sizes = [9, 12, 9];
  angles.forEach((da, i) => {
    ctx.save();
    ctx.rotate(da + (rng() - 0.5) * 0.3);
    const sz = sizes[i] + rng() * 3;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-sz*0.35, -sz*0.45, -sz*0.3, -sz*0.9, 0, -sz*1.25);
    ctx.bezierCurveTo(sz*0.3, -sz*0.9, sz*0.35, -sz*0.45, 0, 0);

    const lg = ctx.createLinearGradient(0, 0, 0, -sz*1.25);
    lg.addColorStop(0, colors[0]);
    lg.addColorStop(0.5, colors[1]);
    lg.addColorStop(1, colors[2]);
    ctx.fillStyle = lg;
    ctx.globalAlpha = 0.88;
    ctx.fill();

    // Leaf vein
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.moveTo(0, -sz*0.1);
    ctx.lineTo(0, -sz*1.1);
    ctx.strokeStyle = 'rgba(0,60,0,0.6)';
    ctx.lineWidth = 0.6;
    ctx.stroke();

    ctx.restore();
  });

  ctx.restore();
}

function drawNodeDot(node) {
  const isHov = hoveredNode && hoveredNode.id === node.id;
  const isSel = selectedNode && selectedNode.id === node.id;
  const r = node.depth === 0 ? 7 : (node.isLeaf ? 4 : 5);
  const extra = isHov ? 2.5 : (isSel ? 3.5 : 0);

  // Glow for selected
  if (isSel) {
    ctx.beginPath();
    ctx.arc(node.x, node.y, r + extra + 6, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(76,175,80,0.15)';
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(node.x, node.y, r + extra, 0, Math.PI*2);
  if (isSel) ctx.fillStyle = '#fff';
  else if (isHov) ctx.fillStyle = '#c8e6c9';
  else if (node.depth === 0) ctx.fillStyle = '#8d6e63';
  else if (node.isLeaf) ctx.fillStyle = '#66bb6a';
  else ctx.fillStyle = '#9e7b6b';
  ctx.fill();

  if (isSel || isHov) {
    ctx.strokeStyle = '#4caf50';
    ctx.lineWidth = isSel ? 2 : 1;
    ctx.stroke();
  }
}

function drawNodeLabel(node) {
  if (!node.labelOpacity || node.labelOpacity <= 0) return;
  const isSel = selectedNode && selectedNode.id === node.id;
  const isHov = hoveredNode && hoveredNode.id === node.id;
  const isRoot = node.depth === 0;

  ctx.save();
  ctx.globalAlpha = node.labelOpacity * (isRoot ? 1 : 0.85);

  const fontSize = isRoot ? 13 : (node.isLeaf ? 10 : 11);
  ctx.font = `${isRoot || isSel ? 'bold ' : ''}${fontSize}px Segoe UI, sans-serif`;

  const label = node.name;
  const tw = ctx.measureText(label).width;

  // Position: above the node, offset by angle direction
  const offX = Math.sin(node.angle) * 14;
  const offY = -Math.cos(node.angle) * 14 - 4;
  let lx = node.x + offX;
  let ly = node.y + offY;

  // Keep in bounds
  lx = Math.max(tw/2 + 6, Math.min(canvas.width - tw/2 - 6, lx));
  ly = Math.max(fontSize + 6, ly);

  // Background pill
  const padX = 6, padY = 3;
  const bx = lx - tw/2 - padX, by = ly - fontSize - padY;
  const bw = tw + padX*2, bh = fontSize + padY*2;

  ctx.fillStyle = isSel ? 'rgba(20,50,20,0.85)' : 'rgba(5,12,22,0.7)';
  roundRect(ctx, bx, by, bw, bh, 5);
  ctx.fill();

  if (isSel) {
    ctx.strokeStyle = 'rgba(76,175,80,0.6)';
    ctx.lineWidth = 1;
    roundRect(ctx, bx, by, bw, bh, 5);
    ctx.stroke();
  }

  ctx.fillStyle = isSel ? '#a5d6a7' : (isRoot ? '#e8f5e9' : '#cfd8dc');
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(label, lx, ly - padY/2);

  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// ================================================================
// ANIMATION LOOP
// ================================================================
const BRANCH_SPEED = 0.022;
const LEAF_SPEED = 0.035;
const LABEL_SPEED = 0.04;

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  drawTrunk();

  // Completed branches
  completedBranches.forEach(b => drawBranchSegment(b, 1));

  // Active branches — update + draw
  const justDone = [];
  activeBranches.forEach(b => {
    b.progress = Math.min(1, b.progress + BRANCH_SPEED);
    drawBranchSegment(b, b.progress);
    if (b.progress >= 1 && !b.done) { b.done = true; justDone.push(b); }
  });

  // Process newly finished branches
  justDone.forEach(b => {
    completedBranches.push(b);
    activeBranches = activeBranches.filter(x => x !== b);

    // Start children
    const kids = allBranches.filter(x => x.parent.id === b.child.id && !x.active);
    if (kids.length > 0) {
      kids.forEach(k => { k.active = true; activeBranches.push(k); });
    } else if (b.child.isLeaf) {
      leaves.push({ node: b.child, scale: 0, colorIdx: leafCounter % 5, leafNum: leafCounter++ });
    }
    // Fade in label
    b.child.labelOpacity = 0;
  });

  // Leaves
  leaves.forEach(l => {
    l.scale = Math.min(1, l.scale + LEAF_SPEED);
    drawLeaf(l);
  });

  // Visible node set
  const vis = new Set(treeRoot ? [treeRoot.id] : []);
  completedBranches.forEach(b => { vis.add(b.parent.id); vis.add(b.child.id); });
  activeBranches.forEach(b => vis.add(b.parent.id));

  // Update label opacities + draw nodes
  allNodes.forEach(node => {
    if (!vis.has(node.id)) return;
    // Fade in label after branch arrives
    if (vis.has(node.id) && node.id !== treeRoot?.id) {
      node.labelOpacity = Math.min(1, (node.labelOpacity || 0) + LABEL_SPEED);
    }
    drawNodeDot(node);
    drawNodeLabel(node);
  });

  updateProgress();
  animFrameId = requestAnimationFrame(animate);
}

function updateProgress() {
  const bar = document.getElementById('progress-bar');
  const total = allBranches.length;
  const done = completedBranches.length;
  if (total === 0) { bar.style.opacity = '0'; return; }
  if (done >= total) {
    bar.style.opacity = '0';
  } else {
    bar.style.opacity = '1';
    const pct = Math.round(done / total * 100);
    bar.textContent = `Rośnie drzewo... ${pct}%  (${Object.keys(currentNotes).length} notatek)`;
  }
}

// ================================================================
// INTERACTION
// ================================================================
function getVisibleNodes() {
  const vis = new Set(treeRoot ? [treeRoot.id] : []);
  completedBranches.forEach(b => { vis.add(b.parent.id); vis.add(b.child.id); });
  activeBranches.forEach(b => vis.add(b.parent.id));
  return vis;
}

function nodeAtPos(mx, my) {
  const vis = getVisibleNodes();
  let best = null, bestD = Infinity;
  allNodes.forEach(node => {
    if (!vis.has(node.id)) return;
    const d = Math.hypot(node.x - mx, node.y - my);
    const r = (node.depth === 0 ? 14 : (node.isLeaf ? 10 : 12));
    if (d < r && d < bestD) { best = node; bestD = d; }
  });
  return best;
}

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width, scaleY = canvas.height / r.height;
  const mx = (e.clientX - r.left) * scaleX;
  const my = (e.clientY - r.top) * scaleY;
  hoveredNode = nodeAtPos(mx, my);
  canvas.style.cursor = hoveredNode ? 'pointer' : 'default';
  const tip = document.getElementById('tooltip');
  if (hoveredNode) {
    tip.style.display = 'block';
    tip.style.left = (e.clientX + 14) + 'px';
    tip.style.top = (e.clientY - 8) + 'px';
    tip.textContent = hoveredNode.name + (hoveredNode.isLeaf ? ' 🍃' : '');
  } else { tip.style.display = 'none'; }
});

canvas.addEventListener('mouseleave', () => {
  hoveredNode = null;
  document.getElementById('tooltip').style.display = 'none';
});

canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width, scaleY = canvas.height / r.height;
  const node = nodeAtPos((e.clientX - r.left) * scaleX, (e.clientY - r.top) * scaleY);
  if (node) { selectedNode = node; showNote(node); }
});

// ================================================================
// NOTE PANEL
// ================================================================
function renderMarkdown(md) {
  let html = md
    // Code blocks first (before other replacements)
    .replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
      `<pre><code>${code.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code></pre>`)
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    // Headers
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    // Bold/italic
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // Wiki links → clickable
    .replace(/\[\[([^\]|#]+?)(?:\|([^\]]*))?\]\]/g, (_, target, alias) =>
      `<span class="wiki-link" onclick="selectById('${target}')">${alias || target.replace(/-/g,' ')}</span>`)
    // Blockquote
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    // Checklist
    .replace(/^- \[x\] (.+)$/gm, '<li style="color:#81c784">✓ $1</li>')
    .replace(/^- \[ \] (.+)$/gm, '<li style="color:#666">☐ $1</li>')
    // Unordered list
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    // Numbered list
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
    // Wrap consecutive li items
    .replace(/(<li[\s\S]*?<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
    // Table (simple)
    .replace(/^\|(.+)\|$/gm, (_, cells) => {
      if (cells.includes('---')) return '';
      const cols = cells.split('|').map(c => `<td>${c.trim()}</td>`).join('');
      return `<tr>${cols}</tr>`;
    })
    .replace(/(<tr>[\s\S]*?<\/tr>\n?)+/g, m => `<table>${m}</table>`)
    // Paragraphs
    .replace(/\n\n+/g, '\n</p><p>\n')
    .replace(/^(?!<[htubpq]|<\/|$)/, '<p>');
  return '<p>' + html + '</p>';
}

function showNote(node) {
  const note = currentNotes[node.id];
  document.getElementById('note-title').textContent = node.name;
  document.getElementById('note-title').classList.remove('placeholder');
  document.getElementById('note-content').innerHTML = renderMarkdown(node.content || '');

  const linksDiv = document.getElementById('links-chips');
  const linksSection = document.getElementById('panel-links');
  if (note && note.links && note.links.length > 0) {
    linksDiv.innerHTML = note.links.map(l =>
      `<span class="link-chip" onclick="selectById('${l}')">${l.replace(/-/g,' ')}</span>`
    ).join('');
    linksSection.style.display = '';
  } else {
    linksSection.style.display = 'none';
  }
}

function selectById(id) {
  const node = allNodes.find(n => n.id === id);
  if (node) {
    selectedNode = node;
    showNote(node);
    hoveredNode = node;
    setTimeout(() => { if (hoveredNode === node) hoveredNode = null; }, 2000);
  }
}

// ================================================================
// CONTROLS
// ================================================================
function restartAnimation() {
  if (animFrameId) cancelAnimationFrame(animFrameId);
  selectedNode = null;
  document.getElementById('note-title').innerHTML = '<span class="placeholder">Kliknij węzeł drzewa<br>aby zobaczyć notatkę</span>';
  document.getElementById('note-content').innerHTML = '';
  document.getElementById('panel-links').style.display = 'none';
  initAnimation();
  animFrameId = requestAnimationFrame(animate);
}

function resetToExample() {
  currentNotes = parseAllNotes(EXAMPLE_NOTES_MD);
  restartAnimation();
}

// ================================================================
// FILE UPLOAD — wczytaj własne notatki Obsidian
// ================================================================
document.getElementById('file-input').addEventListener('change', e => {
  loadFiles(Array.from(e.target.files));
  e.target.value = '';
});

// Drag & drop
const container = document.getElementById('tree-container');
const overlay = document.getElementById('drop-overlay');

container.addEventListener('dragover', e => { e.preventDefault(); overlay.classList.add('active'); });
container.addEventListener('dragleave', e => { if (!container.contains(e.relatedTarget)) overlay.classList.remove('active'); });
container.addEventListener('drop', e => {
  e.preventDefault();
  overlay.classList.remove('active');
  loadFiles(Array.from(e.dataTransfer.files).filter(f => f.name.endsWith('.md')));
});

function loadFiles(files) {
  if (!files.length) return;
  const mdFiles = files.filter(f => f.name.endsWith('.md'));
  if (!mdFiles.length) { alert('Brak plików .md!'); return; }

  let loaded = 0;
  const mdMap = {};

  mdFiles.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      const name = file.name.replace(/\.md$/, '');
      mdMap[name] = ev.target.result;
      loaded++;
      if (loaded === mdFiles.length) {
        currentNotes = parseAllNotes(mdMap);
        restartAnimation();
      }
    };
    reader.readAsText(file);
  });
}

// ================================================================
// START
// ================================================================
restartAnimation();
</script>
